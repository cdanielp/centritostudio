<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"nombre","type":"string","label":"Nombre","default":"SIN-VARIABLE-nombre"},
  {"id":"rol","type":"string","label":"Rol o tema","default":"SIN-VARIABLE-rol"},
  {"id":"marca_primario","type":"color","label":"Color primario","default":"#06B6D4"},
  {"id":"marca_secundario","type":"color","label":"Color secundario","default":"#2A2A35"},
  {"id":"marca_texto","type":"color","label":"Color de texto","default":"#F5F5F7"},
  {"id":"duracion_ms","type":"number","label":"Duracion ms","default":4500},
  {"id":"fps","type":"number","label":"FPS","default":30},
  {"id":"tamano_ancho","type":"number","label":"Ancho","default":1920},
  {"id":"tamano_alto","type":"number","label":"Alto","default":1080},
  {"id":"semilla","type":"number","label":"Semilla","default":0}
 ]'>
  <head>
    <meta charset="UTF-8" />
    <title>lower third minimo</title>
    <script src="../gsap.min.js"></script>
    <style>
      /* Fuente embebida local: Inter variable (SIL OFL 1.1), sin cargas por red. */
      @font-face {
        font-family: "Inter";
        src: url("../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: transparent; }
      :root {
        --primario: #06B6D4;
        --secundario: #2A2A35;
        --texto: #F5F5F7;
        --u: 10.8px;
        --vh: 19.2px;
      }
      #root { position: relative; overflow: hidden; font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      /* Mismo carril que el estilo pms: contenido con el borde inferior en 68% de la altura,
         lejos de la zona de captions (70-92% medida en HF-2). Sin placa: el texto va directo
         sobre el video, por eso lleva una sombra tipo contorno mas fuerte (medida en el lab
         contra fondos claros, no solo oscuros). */
      #lt {
        position: absolute;
        left: 5.5%;
        bottom: 32%;
        display: flex;
        align-items: stretch;
        gap: calc(var(--u) * 1.3);
        max-width: 82%;
      }
      #barra {
        width: calc(var(--u) * 0.55);
        background: var(--primario);
        border-radius: calc(var(--u) * 0.3);
        transform-origin: 50% 0%;
        flex-shrink: 0;
      }
      #textos {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--u) * 0.7);
      }
      #nombre {
        color: var(--texto);
        font-weight: 700;
        font-size: calc(var(--u) * 4.6);
        line-height: 0.92;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow:
          0 0 calc(var(--u) * 0.18) rgba(0, 0, 0, 0.9),
          0 0 calc(var(--u) * 0.45) rgba(0, 0, 0, 0.75),
          calc(var(--u) * -0.14) calc(var(--u) * -0.14) 0 rgba(0, 0, 0, 0.65),
          calc(var(--u) * 0.14) calc(var(--u) * -0.14) 0 rgba(0, 0, 0, 0.65),
          calc(var(--u) * -0.14) calc(var(--u) * 0.14) 0 rgba(0, 0, 0, 0.65),
          calc(var(--u) * 0.14) calc(var(--u) * 0.14) 0 rgba(0, 0, 0, 0.65),
          0 calc(var(--u) * 0.2) calc(var(--u) * 2) rgba(0, 0, 0, 0.5);
      }
      #rol {
        color: color-mix(in srgb, var(--texto) 74%, transparent);
        font-weight: 400;
        font-size: calc(var(--u) * 2.4);
        line-height: 1.2;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-shadow:
          0 0 calc(var(--u) * 0.16) rgba(0, 0, 0, 0.85),
          0 0 calc(var(--u) * 0.35) rgba(0, 0, 0, 0.7),
          calc(var(--u) * -0.1) calc(var(--u) * -0.1) 0 rgba(0, 0, 0, 0.55),
          calc(var(--u) * 0.1) calc(var(--u) * -0.1) 0 rgba(0, 0, 0, 0.55),
          calc(var(--u) * -0.1) calc(var(--u) * 0.1) 0 rgba(0, 0, 0, 0.55),
          calc(var(--u) * 0.1) calc(var(--u) * 0.1) 0 rgba(0, 0, 0, 0.55),
          0 calc(var(--u) * 0.16) calc(var(--u) * 1.4) rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
      <div id="pieza" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <div id="lt">
          <div id="barra"></div>
          <div id="textos">
            <div id="nombre">?</div>
            <div id="rol">?</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      var v = window.__hyperframes.getVariables();
      var W = Number(v.tamano_ancho), H = Number(v.tamano_alto);
      var FPS = Number(v.fps) || 30, DUR = Number(v.duracion_ms) / 1000;
      var F = 1 / FPS;

      var root = document.getElementById("root");
      [document.documentElement, document.body, root].forEach(function (el) {
        el.style.width = W + "px"; el.style.height = H + "px";
      });
      var css = document.documentElement.style;
      css.setProperty("--u", Math.min(W, H) / 100 + "px");
      css.setProperty("--vh", H / 100 + "px");
      css.setProperty("--primario", v.marca_primario);
      css.setProperty("--secundario", v.marca_secundario);
      css.setProperty("--texto", v.marca_texto);
      document.getElementById("pieza").setAttribute("data-duration", String(DUR));
      document.getElementById("nombre").textContent = String(v.nombre);
      document.getElementById("rol").textContent = String(v.rol);

      var ENTRA = Math.min(14 * F, DUR * 0.28);
      var SALE = Math.max(6 * F, ENTRA * 0.65);
      var STAG = 4 * F;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var wrap = document.getElementById("lt");
      var barra = document.getElementById("barra");
      var nombreEl = document.getElementById("nombre");
      var rolEl = document.getElementById("rol");

      /* La barra de acento se dibuja de arriba a abajo, el nombre y el rol entran desde la
         izquierda con un pequeno stagger. */
      gsap.set(barra, { scaleY: 0 });
      gsap.set(nombreEl, { x: -20, opacity: 0 });
      gsap.set(rolEl, { x: -20, opacity: 0 });

      tl.to(barra, { scaleY: 1, duration: ENTRA, ease: "power3.out" }, 0);
      tl.to(nombreEl, { x: 0, opacity: 1, duration: ENTRA * 0.9, ease: "power3.out" }, STAG);
      tl.to(rolEl, { x: 0, opacity: 1, duration: ENTRA * 0.9, ease: "power3.out" }, STAG * 2);

      tl.to(rolEl, { opacity: 0, duration: SALE * 0.6, ease: "power2.in" }, DUR - SALE);
      tl.to(nombreEl, { y: -12, opacity: 0, duration: SALE * 0.7, ease: "power2.in" }, DUR - SALE * 0.85);
      tl.to(barra, { scaleY: 0, duration: SALE * 0.7, ease: "power2.in" }, DUR - SALE * 0.8);
      tl.set(wrap, { visibility: "hidden" }, DUR - (2 * F));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
