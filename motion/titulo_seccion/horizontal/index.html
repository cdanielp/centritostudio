<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Titulo de seccion","default":"SIN-VARIABLE-titulo"},
  {"id":"marca_primario","type":"color","label":"Color primario","default":"#6C3AED"},
  {"id":"marca_secundario","type":"color","label":"Color secundario","default":"#2A2A35"},
  {"id":"marca_texto","type":"color","label":"Color de texto","default":"#F5F5F7"},
  {"id":"duracion_ms","type":"number","label":"Duracion ms","default":2000},
  {"id":"fps","type":"number","label":"FPS","default":30},
  {"id":"tamano_ancho","type":"number","label":"Ancho","default":1920},
  {"id":"tamano_alto","type":"number","label":"Alto","default":1080},
  {"id":"semilla","type":"number","label":"Semilla","default":0}
 ]'>
  <head>
    <meta charset="UTF-8" />
    <title>titulo de seccion</title>
    <script src="../gsap.min.js"></script>
    <style>
      /* Fuente embebida local: Inter variable (SIL OFL 1.1), sin cargas por red. */
      @font-face {
        font-family: "Inter";
        src: url("../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: transparent; }
      :root {
        --primario: #6C3AED;
        --secundario: #2A2A35;
        --texto: #F5F5F7;
        --u: 10.8px;
        --vh: 19.2px;
        /* Estructurales de legibilidad: placa oscura y sombra (unicos colores fijos). */
        --placa: rgba(8, 8, 15, 0.78);
        --sombra: rgba(0, 0, 0, 0.45);
      }
      #root { position: relative; overflow: hidden; font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      /* Horizontal: centro del bloque en ~31% de la altura, fuera de captions (70-92%). */
      #zona {
        position: absolute; left: 0; top: 0; width: 100%; height: 62%;
        display: grid; place-items: center;
      }
      #placa {
        background: var(--placa);
        border: 1px solid color-mix(in srgb, var(--secundario) 45%, transparent);
        border-radius: calc(var(--u) * 1.8);
        padding: calc(var(--u) * 2.8) calc(var(--u) * 4);
        max-width: 84%;
        text-align: center;
        box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 2.4) var(--sombra);
      }
      #linea {
        width: calc(var(--u) * 12);
        height: calc(var(--u) * 0.7);
        background: var(--primario);
        border-radius: calc(var(--u) * 0.35);
        margin: 0 auto calc(var(--u) * 1.8);
        transform-origin: 50% 50%;
      }
      #titulo {
        color: var(--texto);
        font-weight: 800;
        font-size: calc(var(--u) * 6.6);
        line-height: 1.1;
        letter-spacing: -0.012em;
        text-wrap: balance;
        text-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.9) var(--sombra);
      }
      /* Vertical 9:16: la cara del reframe vive en 20-45% del alto; la pieza baja a la
         franja 50-70% (contenido hasta 68%) para no taparla. */
      @media (orientation: portrait) {
        #zona { height: 68%; place-items: end center; }
        #placa {
          padding: calc(var(--u) * 2.2) calc(var(--u) * 3.2);
          box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) var(--sombra);
        }
        #linea { margin-bottom: calc(var(--u) * 1.4); }
        #titulo { font-size: calc(var(--u) * 5.4); }
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
      <div id="pieza" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div id="zona">
          <div id="placa">
            <div id="respira">
              <div id="linea"></div>
              <div id="titulo">?</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      var v = window.__hyperframes.getVariables();
      var W = Number(v.tamano_ancho), H = Number(v.tamano_alto);
      var FPS = Number(v.fps) || 30, DUR = Number(v.duracion_ms) / 1000;
      var F = 1 / FPS;

      var root = document.getElementById("root");
      [document.documentElement, document.body, root].forEach(function (el) {
        el.style.width = W + "px"; el.style.height = H + "px";
      });
      var css = document.documentElement.style;
      css.setProperty("--u", Math.min(W, H) / 100 + "px");
      css.setProperty("--vh", H / 100 + "px");
      css.setProperty("--primario", v.marca_primario);
      css.setProperty("--secundario", v.marca_secundario);
      css.setProperty("--texto", v.marca_texto);
      document.getElementById("pieza").setAttribute("data-duration", String(DUR));
      document.getElementById("titulo").textContent = String(v.titulo);

      /* Pieza corta: entrada mas contenida para que el sostenimiento se sienta. */
      var ENTRA = Math.min(12 * F, DUR * 0.26);
      var SALE = Math.max(6 * F, ENTRA * 0.65);
      var STAG = 4 * F;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      /* La placa nunca entra vacia: la linea arranca con ella, el titulo un paso despues. */
      tl.from("#placa", { opacity: 0, y: 26, scale: 0.96, duration: ENTRA, ease: "power3.out" }, 0);
      tl.from("#linea", { scaleX: 0, opacity: 0, duration: ENTRA * 0.9, ease: "power3.out" }, 0);
      tl.from("#titulo", { opacity: 0, y: 18, duration: ENTRA * 0.9, ease: "power3.out" }, STAG);

      var medio = 18 * F, resto = (DUR - SALE) - ENTRA;
      var reps = Math.floor(resto / medio) - 1;
      if (reps % 2 === 0) reps -= 1;
      if (reps >= 1) {
        tl.to("#respira", { scale: 1.008, duration: medio, ease: "sine.inOut", yoyo: true, repeat: reps }, ENTRA);
      }

      tl.to("#pieza", { opacity: 0, y: -16, duration: SALE, ease: "power2.in" }, DUR - SALE);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
