<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"cifra","type":"string","label":"Cifra","default":"SIN-VARIABLE-cifra"},
  {"id":"etiqueta","type":"string","label":"Etiqueta","default":"SIN-VARIABLE-etiqueta"},
  {"id":"marca_primario","type":"color","label":"Color primario","default":"#06B6D4"},
  {"id":"marca_secundario","type":"color","label":"Color secundario","default":"#2A2A35"},
  {"id":"marca_texto","type":"color","label":"Color de texto","default":"#F5F5F7"},
  {"id":"duracion_ms","type":"number","label":"Duracion ms","default":3000},
  {"id":"fps","type":"number","label":"FPS","default":30},
  {"id":"tamano_ancho","type":"number","label":"Ancho","default":1920},
  {"id":"tamano_alto","type":"number","label":"Alto","default":1080},
  {"id":"semilla","type":"number","label":"Semilla","default":0}
 ]'>
  <head>
    <meta charset="UTF-8" />
    <title>dato destacado</title>
    <script src="../gsap.min.js"></script>
    <style>
      /* Fuente embebida local: Inter variable (SIL OFL 1.1), sin cargas por red. */
      @font-face {
        font-family: "Inter";
        src: url("../fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: transparent; }
      :root {
        --primario: #06B6D4;
        --secundario: #2A2A35;
        --texto: #F5F5F7;
        --u: 10.8px;
        --vh: 19.2px;
        /* Estructurales de legibilidad: placa oscura y sombra (unicos colores fijos). */
        --placa: rgba(8, 8, 15, 0.78);
        --sombra: rgba(0, 0, 0, 0.45);
      }
      #root { position: relative; overflow: hidden; font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      /* Horizontal (HF-4b): ancla el borde superior en 54% (igual que el carril vertical de
         mas abajo) y crece hacia ABAJO. `desplazamiento_de_banda` sube todo -34pp para la
         banda superior; centrado en vez de anclado arriba, un titulo de tres lineas se salia
         por el borde superior del lienzo. Ver hook/index.html para el detalle completo. ESTA
         regla rige el gemelo horizontal (su lienzo nunca dispara el media portrait de mas
         abajo); el bloque portrait sigue intacto y sigue rigiendo el carril vertical. */
      #zona {
        position: absolute; left: 0; top: 54%; width: 100%; height: 46%;
        display: grid; place-items: start center;
      }
      #placa {
        background: var(--placa);
        border: 1px solid color-mix(in srgb, var(--secundario) 45%, transparent);
        border-radius: calc(var(--u) * 2);
        padding: calc(var(--u) * 3) calc(var(--u) * 4.6);
        max-width: 84%;
        text-align: center;
        box-shadow: 0 calc(var(--u) * 0.7) calc(var(--u) * 2.6) var(--sombra);
      }
      #cifra {
        color: var(--primario);
        font-weight: 900;
        font-size: calc(var(--u) * 13);
        line-height: 1;
        letter-spacing: -0.02em;
        text-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) var(--sombra);
      }
      #subraya {
        width: calc(var(--u) * 10);
        height: calc(var(--u) * 0.6);
        background: color-mix(in srgb, var(--secundario) 80%, var(--texto) 20%);
        border-radius: calc(var(--u) * 0.3);
        margin: calc(var(--u) * 1.6) auto;
        transform-origin: 50% 50%;
      }
      #etiqueta {
        color: var(--texto);
        font-weight: 520;
        font-size: calc(var(--u) * 3.4);
        line-height: 1.25;
        max-width: calc(var(--u) * 58);
        margin: 0 auto;
        text-wrap: balance;
      }
      /* Vertical 9:16: la cara del reframe vive en 20-45% del alto; la pieza baja a la
         franja 50-70% (contenido hasta 68%) y la cifra reduce cuerpo para caber. */
      @media (orientation: portrait) {
        /* HF-4 hotfix: ver motion/hook/index.html para el detalle completo. Este bloque solo
           tocaba `height`, asi que el `top:54%` del gemelo horizontal se colaba y la caja
           quedaba en [54%,122%] con el contenido anclado al borde inferior (fuera del
           lienzo). Con `top:auto; bottom:32%` la caja pasa a [0%,68%]. */
        #zona { top: auto; bottom: 32%; height: 68%; place-items: end center; }
        #placa {
          padding: calc(var(--u) * 2.4) calc(var(--u) * 3.6);
          box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) var(--sombra);
        }
        #cifra { font-size: calc(var(--u) * 9); }
        #subraya { margin: calc(var(--u) * 1.2) auto; }
        #etiqueta { font-size: calc(var(--u) * 3); }
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
      <div id="pieza" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="zona">
          <div id="placa">
            <div id="respira">
              <div id="cifra">?</div>
              <div id="subraya"></div>
              <div id="etiqueta">?</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      var v = window.__hyperframes.getVariables();
      var W = Number(v.tamano_ancho), H = Number(v.tamano_alto);
      var FPS = Number(v.fps) || 30, DUR = Number(v.duracion_ms) / 1000;
      var F = 1 / FPS;

      var root = document.getElementById("root");
      [document.documentElement, document.body, root].forEach(function (el) {
        el.style.width = W + "px"; el.style.height = H + "px";
      });
      var css = document.documentElement.style;
      css.setProperty("--u", Math.min(W, H) / 100 + "px");
      css.setProperty("--vh", H / 100 + "px");
      css.setProperty("--primario", v.marca_primario);
      css.setProperty("--secundario", v.marca_secundario);
      css.setProperty("--texto", v.marca_texto);
      document.getElementById("pieza").setAttribute("data-duration", String(DUR));
      document.getElementById("cifra").textContent = String(v.cifra);
      document.getElementById("etiqueta").textContent = String(v.etiqueta);

      var ENTRA = Math.min(14 * F, DUR * 0.28);
      var SALE = Math.max(6 * F, ENTRA * 0.65);
      var STAG = 4 * F;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      /* La placa nunca entra vacia: la cifra arranca con ella; el resto escalona. */
      tl.from("#placa", { opacity: 0, y: 30, scale: 0.95, duration: ENTRA, ease: "power3.out" }, 0);
      tl.from("#cifra", { opacity: 0, scale: 0.82, duration: ENTRA, ease: "back.out(1.5)" }, 0);
      tl.from("#subraya", { scaleX: 0, opacity: 0, duration: ENTRA * 0.8, ease: "power3.out" }, STAG);
      tl.from("#etiqueta", { opacity: 0, y: 16, duration: ENTRA * 0.85, ease: "power2.out" }, STAG * 2);

      var medio = 20 * F, resto = (DUR - SALE) - ENTRA;
      var reps = Math.floor(resto / medio) - 1;
      if (reps % 2 === 0) reps -= 1;
      if (reps >= 1) {
        tl.to("#respira", { scale: 1.01, duration: medio, ease: "sine.inOut", yoyo: true, repeat: reps }, ENTRA);
      }

      tl.to("#pieza", { opacity: 0, y: -18, duration: SALE, ease: "power2.in" }, DUR - SALE);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
