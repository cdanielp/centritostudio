[pytest]
testpaths = tests
# HF-1: el render REAL contra HyperFrames instalado queda FUERA de la suite por default
# (es lento y necesita npx + Chrome headless). Para correrlo a mano:
#   venv\Scripts\python -m pytest tests/test_hf_real.py -m hf_real
addopts = -m "not hf_real"
markers =
    hf_real: renderiza de verdad con HyperFrames (lento, requiere npx y Chrome headless)
